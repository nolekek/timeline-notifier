# Обычно не нужен: админка уже закрыта Basic Auth (ADMIN_USER/ADMIN_PASSWORD).
# Ставь nginx, если хочешь HTTPS и красивый домен.
# Тогда в .env поставь WEB_HOST=127.0.0.1, чтобы порт 5000 не торчал в интернет.
#
# Установка:
#   sudo cp deploy/nginx-example.conf /etc/nginx/sites-available/timeline-notifier
#   sudo ln -s /etc/nginx/sites-available/timeline-notifier /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name timeline.example.com;   # <-- свой домен

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTPS: sudo certbot --nginx -d timeline.example.com  (Certbot сам допишет блок 443)
