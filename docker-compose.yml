# Timeline Notifier в Docker: бот + планировщик + админка одним контейнером.
#
#   docker compose up -d --build     # собрать и запустить
#   docker compose logs -f           # смотреть логи (там же getMe, проверки, ошибки)
#   docker compose ps                # статус + healthy
#   docker compose restart           # перезапуск
#   docker compose down              # остановить и удалить контейнер (база в ./instance остаётся)
#   docker compose up -d --build     # обновление после git pull
#
# ВАЖНО: один токен бота = один запущенный инстанс. Нельзя одновременно держать этот
# контейнер и локальный `python run.py` с тем же токеном — Telegram отдаст апдейты только
# одному, во втором будет 409 Conflict и бот не увидит команды.

services:
  bot:
    build: .
    image: timeline-notifier:latest
    container_name: timeline-notifier
    restart: unless-stopped

    # Пишем в ./instance от имени владельца этой папки (по умолчанию uid/gid 1000 —
    # типичный первый пользователь Ubuntu). Так не нужны никакие chown и sudo:
    # бэкап базы = обычное копирование файла. Если `id -u` у тебя другой —
    # впиши APP_UID/APP_GID в .env.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"

    # Секреты и настройки: SECRET_KEY, CRED_KEY, ADMIN_USER/ADMIN_PASSWORD,
    # ADMIN_CHAT_ID, TELEGRAM_PROXY, интервалы. Файл .env в образ не попадает.
    env_file: .env

    environment:
      # Внутри контейнера всегда слушаем 5000 (наружу порт задаётся в ports ниже),
      # а TZ обязателен: от него зависят напоминания 48/24/12 часов.
      TZ: Europe/Moscow
      WEB_HOST: 0.0.0.0
      WEB_PORT: "5000"
      # База — на смонтированном томе, а не внутри образа
      DATABASE_URL: sqlite:////app/instance/timeline.db

    ports:
      # "порт на сервере:порт в контейнере". Меняется через APP_PORT в .env
      # (например, APP_PORT=1337). Хочешь только через nginx — "127.0.0.1:${APP_PORT:-5000}:5000"
      - "${APP_PORT:-5000}:5000"

    volumes:
      # база, логи и instance/debug живут на хосте: переживают пересборку образа,
      # легко бэкапятся простым копированием папки
      - ./instance:/app/instance

    # Если tg-ws-proxy/прокси поднят на ХОСТЕ (systemd), а не в докере —
    # раскомментируй, чтобы из контейнера был виден host.docker.internal:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # Ограничение памяти для ARM-сервера (TV box x96q)
    mem_limit: 256m
    mem_reservation: 64m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Опциональный встроенный сервис tg-ws-proxy (для серверов в РФ)
  # Чтобы включить: в .env раскомментируй TELEGRAM_PROXY=socks5h://tg-proxy:1080
  # и запускай: docker compose --profile proxy up -d --build
  tg-proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.tgproxy
    image: timeline-tg-proxy:latest
    container_name: timeline-tg-proxy
    restart: unless-stopped
    profiles: ["proxy"]
    mem_limit: 128m
    mem_reservation: 32m
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    ports:
      - "127.0.0.1:1080:1080"
